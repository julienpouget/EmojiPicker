name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      # The package targets iOS only, so `swift build`/`swift test` can't run on
      # the macOS host — drive it through xcodebuild against an iOS simulator.
      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme EmojiPicker \
            -destination 'platform=iOS Simulator,name=iPhone 16'
